[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-pydantic-ai"
version = "0.1.0"
description = "Agentic RAG agent built with Pydantic AI, using FAISS for vector search"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=2.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "httpx>=0.27",
    "ddgs>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Ollama server (and network for web_search)",
]
addopts = "-m 'not integration'"
